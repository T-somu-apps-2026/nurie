<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぺたぺたぬりえ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
/* Layout: one-screen toy — picture tabs on top, big canvas in the middle, fat crayon palette at the bottom. Single bright theme by choice. */
:root{
  --bg:#fff6e0; --paper:#ffffff; --ink:#3b2a20; --line:#3b2a20;
  --tab:#ffe4a8; --tab-on:#ffb84d; --shadow:#e9cf98;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;max-width:640px;margin:0 auto;box-sizing:border-box}
.pics{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pics{gap:6px}
.pics button{width:50px;height:50px;border-radius:15px;border:3px solid var(--line);background:var(--tab);
  display:grid;place-items:center;padding:4px;cursor:pointer;box-shadow:0 4px 0 var(--shadow)}
.pics button[aria-pressed="true"]{background:var(--tab-on);transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}
.pics svg{width:100%;height:100%}
.stage{flex:1;min-height:0;background:var(--paper);border:4px solid var(--line);border-radius:28px;position:relative;
  display:grid;place-items:center;overflow:hidden}
.stage>svg{width:100%;height:100%;max-height:100%}
.r{cursor:pointer;stroke:var(--line);stroke-width:5;stroke-linejoin:round;transition:fill .15s}
.r.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.06)}}
.r{transform-box:fill-box;transform-origin:center}
.r.bg{stroke:none}
.stage{transition:background .2s}
.palette{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.palette button{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0;
  box-shadow:0 4px 0 rgba(0,0,0,.18);position:relative}
.palette button[aria-pressed="true"]{transform:scale(1.12);box-shadow:0 0 0 5px var(--tab-on)}
.palette button.erase{background:#fff;font-size:26px;display:grid;place-items:center;color:var(--ink);font-family:var(--font)}
.bar{display:flex;gap:10px;justify-content:center}
.bar button[aria-pressed="true"]{background:var(--tab-on)}
.bar button{font-family:var(--font);font-weight:800;font-size:18px;padding:10px 22px;border-radius:999px;border:3px solid var(--line);
  background:var(--tab);color:var(--ink);box-shadow:0 4px 0 var(--shadow);cursor:pointer}
button:focus-visible{outline:4px solid #4a90e2;outline-offset:3px}
.yay{position:absolute;inset:0;pointer-events:none}
.yay span{position:absolute;font-size:34px;animation:fall 1.6s ease-out forwards}
@keyframes fall{from{transform:translateY(-40px) rotate(0);opacity:1}to{transform:translateY(420px) rotate(360deg);opacity:0}}
.msg{position:absolute;top:12px;left:0;right:0;text-align:center;font-weight:800;font-size:28px;color:#ff6b6b;pointer-events:none}
@media (prefers-reduced-motion:reduce){.r.pop,.yay span{animation:none}}
</style>
</head>
<body>

<div class="app">
  <div class="pics" id="pics" role="group" aria-label="えをえらぶ"></div>
  <div class="stage" id="stage"><div class="msg" id="msg" hidden>できたね！</div><div class="yay" id="yay"></div></div>
  <div class="palette" id="palette" role="group" aria-label="いろ"></div>
  <div class="bar"><button id="music" type="button" aria-pressed="false">♪ おんがく</button><button id="reset" type="button">ぜんぶけす</button></div>
</div>

<script>
const R='class="r" fill="#fff"';
const PICS={
fish:`<svg viewBox="0 0 300 300">
 <circle ${R} cx="240" cy="70" r="14"/><circle ${R} cx="262" cy="40" r="9"/>
 <polygon ${R} points="70,150 20,100 30,150 20,200"/>
 <path ${R} d="M120 110 Q150 60 190 105 Z"/>
 <ellipse ${R} cx="150" cy="155" rx="95" ry="60"/>
 <path ${R} d="M130 195 Q150 235 175 200 Z"/>
 <circle ${R} cx="205" cy="140" r="16"/><circle cx="208" cy="140" r="7" fill="#3b2a20"/>
 <rect ${R} x="20" y="250" width="260" height="34" rx="14"/></svg>`,
house:`<svg viewBox="0 0 300 300">
 <circle ${R} cx="245" cy="55" r="30"/>
 <rect ${R} x="10" y="250" width="280" height="40" rx="12"/>
 <rect ${R} x="60" y="140" width="180" height="115"/>
 <polygon ${R} points="40,145 150,55 260,145"/>
 <rect ${R} x="130" y="185" width="45" height="70" rx="6"/>
 <rect ${R} x="78" y="165" width="38" height="38" rx="4"/><rect ${R} x="190" y="165" width="38" height="38" rx="4"/></svg>`,
flower:`<svg viewBox="0 0 300 300">
 <rect ${R} x="142" y="140" width="16" height="100"/>
 <ellipse ${R} cx="115" cy="200" rx="30" ry="14" transform="rotate(-25 115 200)"/>
 <ellipse ${R} cx="185" cy="185" rx="30" ry="14" transform="rotate(25 185 185)"/>
 <circle ${R} cx="150" cy="70" r="32"/><circle ${R} cx="200" cy="105" r="32"/><circle ${R} cx="182" cy="160" r="32"/>
 <circle ${R} cx="118" cy="160" r="32"/><circle ${R} cx="100" cy="105" r="32"/>
 <circle ${R} cx="150" cy="115" r="30"/>
 <polygon ${R} points="95,235 205,235 190,290 110,290"/></svg>`,
car:`<svg viewBox="0 0 300 300">
 <path ${R} d="M85 135 L110 85 L195 85 L225 135 Z"/>
 <rect ${R} x="25" y="130" width="250" height="75" rx="26"/>
 <path ${R} d="M118 95 L145 95 L145 130 L102 130 Z"/><path ${R} d="M160 95 L190 95 L208 130 L160 130 Z"/>
 <circle ${R} cx="85" cy="210" r="32"/><circle ${R} cx="215" cy="210" r="32"/>
 <circle ${R} cx="85" cy="210" r="12"/><circle ${R} cx="215" cy="210" r="12"/>
 <rect ${R} x="10" y="250" width="280" height="36" rx="14"/></svg>`,
ice:`<svg viewBox="0 0 300 300">
 <polygon ${R} points="95,155 205,155 150,290"/>
 <circle ${R} cx="150" cy="125" r="50"/>
 <circle ${R} cx="150" cy="70" r="40"/>
 <circle ${R} cx="150" cy="25" r="16"/>
 <circle ${R} cx="55" cy="60" r="20"/><circle ${R} cx="250" cy="90" r="22"/></svg>`,
cat:`<svg viewBox="0 0 300 300">
 <ellipse ${R} cx="150" cy="262" rx="85" ry="38"/>
 <polygon ${R} points="65,120 82,35 135,85"/><polygon ${R} points="235,120 218,35 165,85"/>
 <ellipse ${R} cx="150" cy="155" rx="98" ry="82"/>
 <polygon ${R} points="82,95 90,60 115,85"/><polygon ${R} points="218,95 210,60 185,85"/>
 <circle cx="115" cy="145" r="11" fill="#3b2a20"/><circle cx="185" cy="145" r="11" fill="#3b2a20"/>
 <polygon ${R} points="138,168 162,168 150,182"/>
 <g stroke="#3b2a20" stroke-width="4" stroke-linecap="round" pointer-events="none">
  <line x1="40" y1="165" x2="100" y2="175"/><line x1="40" y1="195" x2="100" y2="188"/>
  <line x1="260" y1="165" x2="200" y2="175"/><line x1="260" y1="195" x2="200" y2="188"/></g></svg>`,
butterfly:`<svg viewBox="0 0 300 300">
 <ellipse ${R} cx="92" cy="110" rx="62" ry="50" transform="rotate(-20 92 110)"/>
 <ellipse ${R} cx="208" cy="110" rx="62" ry="50" transform="rotate(20 208 110)"/>
 <ellipse ${R} cx="105" cy="200" rx="45" ry="38"/><ellipse ${R} cx="195" cy="200" rx="45" ry="38"/>
 <circle ${R} cx="85" cy="105" r="18"/><circle ${R} cx="215" cy="105" r="18"/>
 <circle ${R} cx="105" cy="205" r="13"/><circle ${R} cx="195" cy="205" r="13"/>
 <g stroke="#3b2a20" stroke-width="5" fill="none" stroke-linecap="round" pointer-events="none">
  <path d="M143 70 Q125 30 105 28"/><path d="M157 70 Q175 30 195 28"/></g>
 <ellipse ${R} cx="150" cy="160" rx="15" ry="80"/>
 <circle ${R} cx="150" cy="72" r="20"/></svg>`,
rocket:`<svg viewBox="0 0 300 300">
 <polygon ${R} points="40,50 46,64 60,70 46,76 40,90 34,76 20,70 34,64"/>
 <polygon ${R} points="255,95 260,107 272,112 260,117 255,129 250,117 238,112 250,107"/>
 <path ${R} d="M122 205 Q150 295 178 205 Z"/>
 <polygon ${R} points="108,145 62,215 108,200"/><polygon ${R} points="192,145 238,215 192,200"/>
 <path ${R} d="M150 25 Q205 80 195 205 L105 205 Q95 80 150 25 Z"/>
 <circle ${R} cx="150" cy="115" r="26"/></svg>`,
cake:`<svg viewBox="0 0 300 300">
 <ellipse ${R} cx="150" cy="255" rx="125" ry="20"/>
 <rect ${R} x="60" y="170" width="180" height="82" rx="12"/>
 <rect ${R} x="95" y="110" width="110" height="64" rx="12"/>
 <rect ${R} x="143" y="58" width="14" height="52" rx="4"/>
 <path ${R} d="M150 22 Q166 42 150 56 Q134 42 150 22 Z"/>
 <circle ${R} cx="115" cy="104" r="13"/><circle ${R} cx="185" cy="104" r="13"/>
 <circle ${R} cx="95" cy="210" r="12"/><circle ${R} cx="150" cy="210" r="12"/><circle ${R} cx="205" cy="210" r="12"/></svg>`,
turtle:`<svg viewBox="0 0 300 300">
 <rect ${R} x="10" y="250" width="280" height="36" rx="14"/>
 <ellipse ${R} cx="90" cy="222" rx="22" ry="28"/><ellipse ${R} cx="210" cy="222" rx="22" ry="28"/>
 <polygon ${R} points="48,180 18,198 52,198"/>
 <circle ${R} cx="252" cy="165" r="30"/><circle cx="262" cy="157" r="6" fill="#3b2a20"/>
 <path ${R} d="M50 195 Q50 85 150 85 Q250 85 250 195 Z"/>
 <polygon ${R} points="128,115 172,115 190,150 172,185 128,185 110,150"/>
 <polygon ${R} points="72,190 82,135 105,150 112,190"/><polygon ${R} points="228,190 218,135 195,150 188,190"/>
 <rect ${R} x="45" y="188" width="210" height="20" rx="10"/></svg>`
};
const COLORS=['#ff4d4d','#ff9f2e','#ffd93b','#c4e84a','#4fbf5a','#2fb5a3','#7fd3ff','#3a6fe0','#8a6bff','#ff8fcf','#a0663b','#4a4a4a'];
const ORDER=Object.keys(PICS);let nextTimer=null;
const pics=document.getElementById('pics'),stage=document.getElementById('stage'),pal=document.getElementById('palette');
let color=COLORS[0],cur='fish',ac=null;
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
 o.frequency.value=400+Math.random()*500;o.type='sine';g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);
 o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.25)}catch(e){}}
Object.keys(PICS).forEach(k=>{const b=document.createElement('button');b.type='button';b.id='pic-'+k;b.innerHTML=PICS[k];b.setAttribute('aria-label',k);
 b.onclick=()=>show(k);pics.appendChild(b)});
[...COLORS,'erase'].forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.id='col-'+i;
 if(c==='erase'){b.className='erase';b.textContent='けす';b.style.fontSize='13px';b.style.fontWeight='800'}else b.style.background=c;
 b.setAttribute('aria-label',c==='erase'?'けしゴム':'いろ'+(i+1));
 b.onclick=()=>{color=c==='erase'?'#fff':c;[...pal.children].forEach(x=>x.setAttribute('aria-pressed',x===b));beep()};pal.appendChild(b)});
pal.children[0].setAttribute('aria-pressed','true');
function paintBg(c){const bg=stage.querySelector(':scope>svg .bg');if(bg)bg.setAttribute('fill',c);stage.style.background=c}
function show(k){cur=k;clearTimeout(nextTimer);[...pics.children].forEach(b=>b.setAttribute('aria-pressed',b.id==='pic-'+k));
 stage.querySelector(':scope>svg')?.remove();stage.insertAdjacentHTML('afterbegin',PICS[k]);
 const svg=stage.querySelector(':scope>svg');
 svg.insertAdjacentHTML('afterbegin','<rect class="r bg" x="-200" y="-200" width="700" height="700" fill="#fff"/>');
 stage.style.background='#fff';document.getElementById('msg').hidden=true;document.getElementById('yay').innerHTML='';
 svg.querySelectorAll('.r').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();
  if(el.classList.contains('bg')){paintBg(color)}else{el.setAttribute('fill',color);el.classList.remove('pop');void el.getBBox();el.classList.add('pop')}
  beep();check()}))}
stage.addEventListener('pointerdown',e=>{if(e.target===stage){paintBg(color);beep()}});
function check(){const parts=[...stage.querySelectorAll(':scope>svg .r:not(.bg)')];const msg=document.getElementById('msg');
 if(parts.every(r=>r.getAttribute('fill')!=='#fff')&&msg.hidden){
 msg.hidden=false;const y=document.getElementById('yay');y.innerHTML='';
 for(let i=0;i<18;i++){const s=document.createElement('span');s.textContent=['⭐','🌟','💖','🎈'][i%4];s.style.left=Math.random()*90+'%';s.style.animationDelay=Math.random()*.6+'s';y.appendChild(s)}
 nextTimer=setTimeout(()=>show(ORDER[(ORDER.indexOf(cur)+1)%ORDER.length]),4000)}}
document.getElementById('reset').onclick=()=>{clearTimeout(nextTimer);stage.querySelectorAll(':scope>svg .r').forEach(r=>r.setAttribute('fill','#fff'));stage.style.background='#fff';document.getElementById('msg').hidden=true;document.getElementById('yay').innerHTML=''};
// BGM: きらきら星 → かえるのうた を交互にくりかえし（オルゴール風）
const N={C:523.25,D:587.33,E:659.25,F:698.46,G:783.99,A:880,_:0};
const SONGS=[
 'C1C1G1G1A1A1G2F1F1E1E1D1D1C2G1G1F1F1E1E1D2G1G1F1F1E1E1D2C1C1G1G1A1A1G2F1F1E1E1D1D1C2_2',
 'C1D1E1F1E1D1C2E1F1G1A1G1F1E2C1_1C1_1C1_1C1_1C.5C.5D.5D.5E.5E.5F.5F.5E1D1C2_2'
];
function parse(s){return [...s.matchAll(/([A-G_])([\d.]+)/g)].map(m=>[N[m[1]],+m[2]])}
let playing=false,timer=null,song=0,idx=0;
const BEAT=.42;
function note(f,d){if(!f)return;const t=ac.currentTime,g=ac.createGain();g.connect(ac.destination);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.6,d*BEAT*1.6));
 [[f,'sine'],[f*2,'triangle']].forEach(([fr,ty],i)=>{const o=ac.createOscillator();o.type=ty;o.frequency.value=fr;
  const og=ac.createGain();og.gain.value=i?.25:1;o.connect(og).connect(g);o.start(t);o.stop(t+2)})}
function step(){if(!playing)return;const notes=parse(SONGS[song]);
 if(idx>=notes.length){idx=0;song=(song+1)%SONGS.length;return step()}
 const [f,d]=notes[idx++];note(f,d);timer=setTimeout(step,d*BEAT*1000)}
const mb=document.getElementById('music');
mb.onclick=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){return}
 playing=!playing;mb.setAttribute('aria-pressed',playing);mb.textContent=playing?'♪ とめる':'♪ おんがく';
 clearTimeout(timer);if(playing)step()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)mb.click()});
show('fish');
</script>
</body>
</html>
